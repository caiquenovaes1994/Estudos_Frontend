<html lang="en">
    <head>
        <link rel="stylesheet" href="styles.css" />
        <script src="https://unpkg.com/lucide@latest"></script>
    </head>
    <body>
        <div class="shell">
            <div class="shell-card">
                <aside class="sidebar">
                    <header class="brand">
                        <span class="brand-mark">
                            <img src="logo.svg">
                        </span>
                        <span class="brand-name">Gonaki</span>
                    </header>
                    <div class="profile">
                        <span class="avatar">
                            <img src="avatar.jpg" alt="" />
                        </span>
                        <span class="profile-name">
                            <span class="name-full">Lionel Messi</span>
                            <span class="name-initials" aria-hidden="true">LM</span>
                        </span>
                        <span class="profile-email">messilionel@gmail.com</span>
                    </div>
                    <ul class="nav">
                        <li>
                            <button type="button">
                                <i data-lucide="user-round"></i>
                                <span class="label">Profile</span>
                                <span class="tip">Profile</span>
                            </button>
                        </li>
                        <li>
                            <button type="button">
                                <i data-lucide="sparkles"></i>
                                <span class="label">Feature</span>
                                <span class="tip">Feature</span>
                            </button>
                        </li>
                        <li>
                            <button type="button">
                                <i data-lucide="package"></i>
                                <span class="label">Package</span>
                                <span class="tip">Package</span>
                            </button>
                        </li>
                        <li>
                            <button type="button">
                                <i data-lucide="life-buoy"></i>
                                <span class="label">Support</span>
                                <span class="tip">Support</span>
                            </button>
                        </li>
                        <li>
                            <button type="button">
                                <i data-lucide="users-round"></i>
                                <span class="label">Community</span>
                                <span class="tip">Community</span>
                            </button>
                        </li>
                    </ul>
                    <ul class="nav nav-exit">
                        <li>
                            <button type="button">
                                <i data-lucide="log-out"></i>
                                <span class="label">Exit</span>
                                <span class="tip">Exit</span>
                            </button>
                        </li>
                    </ul>
                </aside>
                <button type="button" class="collapse-btn" id="collapseBtn" aria-label="Toggle sidebar" aria-expanded="true">
                    <i data-lucide="chevron-left"></i>
                </button>
            </div>
        </div>
        <script type="text/javascript" src="main.js"></script>
    </body>
</html>
