<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar4</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <input type="checkbox" id="theme" class="theme-toggle" />
    <aside class="sidebar">
        <div class="profile">
            <span class="avatar online"><img src="profile.jpg" alt="">
            </span>
            <div class="details">
                <p class="name">Cristiano Ronaldo</p>
                <p class="role">Atacante</p>
            </div>
        </div>

        <div class="search">
            <i data-lucide="search"></i>
            <input type="text" placeholder="Search" />
        </div>

        <p class="section-label">Pages</p>
        
        <ul class="nav">
            <li>
                <input type="radio" name="nav" id="nav-dashboard" class="nav-radio" />
                <label for="nav-dashboard">
                    <span class="icon-wrap">
                        <i data-lucide="layout-grid"></i></span>
                    <p>Dashboard</p>
                </label>
            </li>
            <!-- More items -->
            <li>
                <input type="radio" name="nav" id="nav-analytics" class="nav-radio" />
                <label for="nav-analytics">
                    <span class="icon-wrap">
                        <i data-lucide="bar-chart-2"></i></span>
                    <p>Analytics</p>
                </label>
            </li>
            <li>
                <input type="radio" name="nav" id="nav-messages" class="nav-radio" />
                <label for="nav-messages">
                    <span class="icon-wrap has-dot">
                        <i data-lucide="message-square"></i></span>
                    <p>Messages</p>
                </label>
            </li>
            <li>
                <input type="radio" name="nav" id="nav-notifications" class="nav-radio" />
                <label for="nav-notifications">
                    <span class="icon-wrap has-dot">
                        <i data-lucide="bell"></i></span>
                    <p>Notifications</p>
                </label>
            </li>
            <li>
                <input type="radio" name="nav" id="nav-tasks" class="nav-radio" />
                <label for="nav-tasks">
                    <span class="icon-wrap">
                        <i data-lucide="check-square"></i></span>
                    <p>Tasks</p>
                </label>
            </li>
            <li>
                <input type="radio" name="nav" id="nav-settings" class="nav-radio" />
                <label for="nav-settings">
                    <span class="icon-wrap">
                        <i data-lucide="settings"></i></span>
                    <p>Settings</p>
                </label>
            </li>
        </ul>
        <!-- Another section -->
        <p class="section-label">Team</p>
        <ul class="nav team">
            <li>
                <input type="radio" name="nav" id="team-1" class="nav-radio" />
                <label for="team-1">
                    <span class="avatar sm online"><img src="avatar2.jpg" alt="Lionel Messi"></span>
                    <p>Lionel Messi</p>
                </label>
            </li>
            <li>
                <input type="radio" name="nav" id="team-2" class="nav-radio" />
                <label for="team-2">
                    <span class="avatar sm"><img src="avatar3.jpg" alt="Neymar Jr"></span>
                    <p>Neymar Jr</p>
                </label>
            </li>
            <li>
                <input type="radio" name="nav" id="team-3" class="nav-radio" />
                <label for="team-3">
                    <span class="avatar sm online"><img src="profile.jpg" alt="Kylian Mbappé"></span>
                    <p>Kylian Mbappé</p>
                </label>
            </li>
        </ul>

        <label class="theme-switch" for="theme">
            <p>Dark Mode</p>
            <span class="switch"></span>
        </label>
    </aside>

    <main class="page">
        <header class="page-header">
            <h1>Dashboard</h1>
            <p>Welcome back, Cristiano Ronaldo</p>
        </header>

        <section class="cards-grid">
            <div class="card">
                <span class="card-icon"><i data-lucide="trending-up"></i></span>
                <div>
                    <h3>900+</h3>
                    <p>Career Goals</p>
                </div>
            </div>
            <div class="card">
                <span class="card-icon"><i data-lucide="trophy"></i></span>
                <div>
                    <h3>5</h3>
                    <p>Ballon d'Or</p>
                </div>
            </div>
            <div class="card">
                <span class="card-icon"><i data-lucide="award"></i></span>
                <div>
                    <h3>35</h3>
                    <p>Trophies</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
