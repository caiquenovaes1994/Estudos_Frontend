<!DOCTYPE html>
<html lang="en">
<head>

    <title>Sidebar 1</title>
</head>
<body>

            </header>
            <ul>
                <li>
                    <button type="button" onclick="gotoPage(this)">
                        <i class="ai-dashboard"></i>

                    </button>
                </li>
                <li>
                    <button type="button" onclick="gotoPage(this)">
                        <i class="ai-grid"></i>

                </li>
                <li>
                    <button type="button" onclick="gotoPage(this)">

                <li>

    <script type="text/javascript" src="main.js"></script>

</html>
