<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palette Color Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app">
        <h1>Color Palette Generator 🎨</h1>
        <p class="subtitle">Find your next favorite color combination!</p>

        <div class="palette" id="palette"></div>

        <button class="generate" onclick="generatePalette()">Generate New Palette</button>

        <p id="message" aria-live="polite"></p>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
