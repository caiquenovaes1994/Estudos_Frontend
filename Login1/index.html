<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sign In & Sign Up</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://unpkg.com/akar-icons-fonts/dist/akar-icons-fonts.css">
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="card">
            <ul class="card-nav">
                <li>
                    <img src="logo.svg" />
                    <span class="active-bar"></span>
                </li>
                <li>
                    <button type="button" class="signin active" onclick="selectView('signin')">
                        <i class="ai-person-check"></i>
                        <span>Sign In</span>
                    </button>
                </li>
                <li>
                    <button type="button" class="signup" onclick="selectView('signup')">
                        <i class="ai-person-add"></i>
                        <span>Sign Up</span>
                    </button>
                </li>
            </ul>
        <div class="card-hero">
            <div class="card-hero-inner">
                <div class="card-hero-content signin">
                    <div>
                        <h2>Welcome Back.</h2>
                        <h3>Please enter your credentials.</h3>
                    </div>
                    <img src="signin.png" />
                </div>
                <div class="card-hero-content signup">
                    <div>
                        <h2>Sign Up Now.</h2>
                        <h3>Join the crowd and get started.</h3>
                    </div>
                    <img src="signup.png" />
                </div>
            </div>
        </div>
        <div class="card-form">
            <div class="forms">
                <form id="signin" class="active">
                    <div class="form-item">
                        <label for="signin-email">Email or Username</label>
                        <div class="input-wrapper">
                            <i class="ai-envelope"></i>
                            <input type="text" id="signin-email" name="username" placeholder="name@example.com" required autocomplete="username" />
                        </div>
                    </div>
                    <div class="form-item">
                        <label for="signin-password">Password</label>
                        <div class="input-wrapper">
                            <i class="ai-lock-on"></i>
                            <input type="password" id="signin-password" name="password" placeholder="••••••••" required autocomplete="current-password" />
                            <button type="button" class="btn-toggle-pass" onclick="togglePassword('signin-password', this)">
                                <i class="ai-eye-closed"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-options">
                        <label class="checkbox-container">
                            <input type="checkbox" name="remember" />
                            <span class="checkmark"></span>
                            <span class="label-text">Remember me</span>
                        </label>
                        <a href="#" class="forgot-pass">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn-submit">
                        <span>Sign In</span>
                        <i class="ai-arrow-right"></i>
                    </button>
                    <div class="form-divider">
                        <span>or continue with</span>
                    </div>
                    <div class="social-actions">
                        <button type="button" class="btn-social google" title="Sign in with Google">
                            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15.2s.7 5.5 1.9 7.9l3.7-2.9z"/><path fill="#34A853" d="M12 23.5c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2-6.4-4.8L1.9 16.9C3.7 20.6 7.5 23.5 12 23.5z"/></svg>
                            <span>Google</span>
                        </button>
                        <button type="button" class="btn-social github" title="Sign in with GitHub">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
                            <span>GitHub</span>
                        </button>
                    </div>
                </form>
                <form id="signup">
                    <div class="form-item">
                        <label for="signup-name">Full Name</label>
                        <div class="input-wrapper">
                            <i class="ai-person"></i>
                            <input type="text" id="signup-name" name="name" placeholder="Alex Morgan" required autocomplete="name" />
                        </div>
                    </div>
                    <div class="form-item">
                        <label for="signup-email">Email Address</label>
                        <div class="input-wrapper">
                            <i class="ai-envelope"></i>
                            <input type="email" id="signup-email" name="email" placeholder="alex@example.com" required autocomplete="email" />
                        </div>
                    </div>
                    <div class="form-item">
                        <label for="signup-password">Password</label>
                        <div class="input-wrapper">
                            <i class="ai-lock-on"></i>
                            <input type="password" id="signup-password" name="password" placeholder="At least 8 characters" required autocomplete="new-password" />
                            <button type="button" class="btn-toggle-pass" onclick="togglePassword('signup-password', this)">
                                <i class="ai-eye-closed"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-item">
                        <label for="signup-confirm-password">Confirm Password</label>
                        <div class="input-wrapper">
                            <i class="ai-lock-on"></i>
                            <input type="password" id="signup-confirm-password" name="confirm_password" placeholder="Repeat your password" required autocomplete="new-password" />
                        </div>
                    </div>
                    <div class="form-options">
                        <label class="checkbox-container">
                            <input type="checkbox" name="terms" required />
                            <span class="checkmark"></span>
                            <span class="label-text">I agree to the <a href="#">Terms</a> & <a href="#">Privacy Policy</a></span>
                        </label>
                    </div>
                    <button type="submit" class="btn-submit">
                        <span>Sign Up</span>
                        <i class="ai-arrow-right"></i>
                    </button>
                    <div class="form-divider">
                        <span>or register with</span>
                    </div>
                    <div class="social-actions">
                        <button type="button" class="btn-social google" title="Sign up with Google">
                            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15.2s.7 5.5 1.9 7.9l3.7-2.9z"/><path fill="#34A853" d="M12 23.5c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2-6.4-4.8L1.9 16.9C3.7 20.6 7.5 23.5 12 23.5z"/></svg>
                            <span>Google</span>
                        </button>
                        <button type="button" class="btn-social github" title="Sign up with GitHub">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
                            <span>GitHub</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
    </body>
</html>
