<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Button Animation</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,700&amp;display=swap">
</head>

<body>
    <div class="wrapper">
        <input type="checkbox">
        <div class="video">
            <video src="https://www.robmillsarchitects.com/assets/uploads/files/RMA_BellevueHillResidenceII_01.mp4" loop muted autoplay playsinline></video>
        </div>

        <div class="text">
            <span data-text="Watch the video"></span>
        </div>
        <div class="socials">
        <a href="#" class="social-icon facebook">
            <i class="fab fa-facebook-f"></i>
        </a>
        <a href="#" class="social-icon twitter">
            <i class="fab fa-x-twitter"></i>
        </a>
        <a href="#" class="social-icon instagram">
            <i class="fab fa-instagram"></i>
        </a>
        <a href="#" class="social-icon linkedin">
            <i class="fab fa-linkedin-in"></i>
        </a>
        <a href="#" class="social-icon youtube">
            <i class="fab fa-youtube"></i>
        </a>
        <a href="#" class="social-icon tiktok">
            <i class="fab fa-tiktok"></i>
        </a>
        <a href="#" class="social-icon whatsapp">
            <i class="fab fa-whatsapp"></i>
        </a>
        <a href="#" class="social-icon telegram">
            <i class="fab fa-telegram"></i>
        </a>
        <a href="#" class="social-icon github">
            <i class="fab fa-github"></i>
    </div>
</body>

</html>
