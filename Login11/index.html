<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login11</title>
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="scene">
        <!-- Neon Ring with layered glows for authentic gradient neon lighting -->
        <div class="neon-ring-wrapper">
            <div class="neon-glow-outer"></div>
            <div class="neon-glow-inner"></div>
            <div class="neon-ring-core"></div>
        </div>

        <div class="card">
            <!-- Front Face: Login -->
            <form class="face front" autocomplete="off" onsubmit="event.preventDefault()">
                <h2>WELCOME</h2>
                <p class="subtitle">Login to your account</p>
                
                <div class="input-box">
                    <input type="email" placeholder="Email Address" required>
                </div>
                
                <div class="input-box password-box">
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                        <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path class="eye-open" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle class="eye-open" cx="12" cy="12" r="3"></circle>
                            <path class="eye-closed" style="display:none;" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22"></path>
                        </svg>
                    </button>
                </div>

                <div class="options">
                    <label class="remember-label">
                        <input type="checkbox" checked>
                        <span class="custom-checkbox"></span>
                        <span class="remember-text">Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot?</a>
                </div>

                <button type="submit" class="btn-submit">LOGIN</button>

                <div class="footer-text">
                    <span>Don't have an account?</span>
                    <a class="show-signup" href="#">Sign Up</a>
                </div>
            </form>

            <!-- Back Face: Sign Up -->
            <form class="face back" autocomplete="off" onsubmit="event.preventDefault()">
                <h2>SIGN UP</h2>
                <p class="subtitle">Create your account</p>

                <div class="input-box">
                    <input type="text" placeholder="Full Name" required>
                </div>

                <div class="input-box">
                    <input type="email" placeholder="Email Address" required>
                </div>

                <div class="input-box password-box">
                    <input type="password" id="signup-password" placeholder="Password" required>
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                        <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path class="eye-open" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle class="eye-open" cx="12" cy="12" r="3"></circle>
                            <path class="eye-closed" style="display:none;" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22"></path>
                        </svg>
                    </button>
                </div>

                <button type="submit" class="btn-submit">CREATE ACCOUNT</button>

                <div class="footer-text">
                    <span>Already have an account?</span>
                    <a class="show-login" href="#">Login</a>
                </div>
            </form>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
