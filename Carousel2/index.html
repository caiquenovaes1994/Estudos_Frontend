<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
        <link rel="stylesheet" href="styles.css">
        <title>Carousel2</title>
    </head>
    <body>
        <div class="swiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide">
                    <div class="slide-bg" style="background-image: url('1.jpg')" data-swiper-parallax="1152">
                        <div class="slide-container">
                            <h3 data-swiper-parallax="-500">01. NATUREZA</h3>
                            <h2 data-swiper-parallax="-1000">Cristiano Ronaldo</h2>
                            <p data-swiper-parallax="-1500">Atacante português.</p>
                        </div>
                    </div>
                </div>

                <div class="swiper-slide">
                    <div class="slide-bg" style="background-image: url('2.jpg')" data-swiper-parallax="1152">
                        <div class="slide-container">
                            <h3 data-swiper-parallax="-500">02. AVENTURA</h3>
                            <h2 data-swiper-parallax="-1000">Erling Haaland</h2>
                            <p data-swiper-parallax="-1500">Atacante norueguês.</p>
                        </div>
                    </div>
                </div>

                <div class="swiper-slide">
                    <div class="slide-bg" style="background-image: url('3.jpg')" data-swiper-parallax="1152">
                        <div class="slide-container">
                            <h3 data-swiper-parallax="-500">03. DESCOBERTA</h3>
                            <h2 data-swiper-parallax="-1000">Kylian Mbappé</h2>
                            <p data-swiper-parallax="-1500">Atacante francês.</p>
                        </div>
                    </div>
                </div>

                <div class="swiper-slide">
                    <div class="slide-bg" style="background-image: url('4.jpg')" data-swiper-parallax="1152">
                        <div class="slide-container">
                            <h3 data-swiper-parallax="-500">04. EXPEDIÇÃO</h3>
                            <h2 data-swiper-parallax="-1000">Lionel Messi</h2>
                            <p data-swiper-parallax="-1500">Atacante argentino.</p>
                        </div>
                    </div>
                </div>

                <div class="swiper-slide">
                    <div class="slide-bg" style="background-image: url('5.jpg')" data-swiper-parallax="1152">
                        <div class="slide-container">
                            <h3 data-swiper-parallax="-500">05. LIBERDADE</h3>
                            <h2 data-swiper-parallax="-1000">Neymar Jr.</h2>
                            <p data-swiper-parallax="-1500">Atacante brasileiro.</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="swiper-pagination"></div>

            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
        <script src="main.js"></script>
    </body>
</html>
