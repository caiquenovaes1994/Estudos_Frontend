<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Menu.css" />
</head>
<body>

    <button class="burger" id="burgerBtn" aria-label="Abrir menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="background" id="background"></div>

    <div class="menu" id="menu">
        <nav>
            <a href="#home"     class="appear" style="animation-delay: 0.1s" data-page="home">Home</a>
            <a href="#about"    class="appear" style="animation-delay: 0.2s" data-page="about">About</a>
            <a href="#services" class="appear" style="animation-delay: 0.3s" data-page="services">Services</a>
            <a href="#contact"  class="appear" style="animation-delay: 0.4s" data-page="contact">Contact</a>
        </nav>
    </div>

    <main class="content" id="content">
        <section id="page-home">
            <h2>Home</h2>
            <p>Bem-vindo! Selecione uma opção no menu para navegar.</p>
        </section>

        <section id="page-about" hidden>
            <h2>About</h2>
            <p>Aqui vai o conteúdo da página Sobre.</p>
        </section>

        <section id="page-services" hidden>
            <h2>Services</h2>
            <p>Aqui vai o conteúdo da página Serviços.</p>
        </section>

        <section id="page-contact" hidden>
            <h2>Contact</h2>
            <p>Aqui vai o conteúdo da página Contato.</p>
        </section>
    </main>

    <script>
        const burgerBtn  = document.getElementById('burgerBtn');
        const background = document.getElementById('background');
        const menu       = document.getElementById('menu');
        const content    = document.getElementById('content');
        const navLinks   = document.querySelectorAll('.menu nav a');

        function toggleMenu() {
            const isOpen = burgerBtn.classList.toggle('open');
            burgerBtn.setAttribute('aria-expanded', isOpen);
            background.classList.toggle('open', isOpen);
            menu.classList.toggle('open', isOpen);
            content.classList.toggle('open', isOpen);

            navLinks.forEach(a => {
                a.classList.remove('appear');
                if (isOpen) {
                    void a.offsetWidth;
                    a.classList.add('appear');
                }
            });
        }

        function closeMenu() {
            burgerBtn.classList.remove('open');
            burgerBtn.setAttribute('aria-expanded', false);
            background.classList.remove('open');
            menu.classList.remove('open');
            content.classList.remove('open');
            navLinks.forEach(a => a.classList.remove('appear'));
        }

        function navigate(page) {
            document.querySelectorAll('main section').forEach(sec => {
                sec.hidden = sec.id !== `page-${page}`;
            });
        }

        burgerBtn.addEventListener('click', toggleMenu);
        background.addEventListener('click', closeMenu);

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && burgerBtn.classList.contains('open')) {
                closeMenu();
            }
        });

        navLinks.forEach(link => {
            link.addEventListener('click', e => {
                e.preventDefault();
                navigate(link.dataset.page);
                closeMenu();
            });
        });
    </script>
</body>
</html>
