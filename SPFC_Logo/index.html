<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPFC Logo em SVG</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }
        
        .escudo-spfc {
            width: 300px;
            height: auto;
        }
    </style>
</head>

<body>
    <svg class="escudo-spfc" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Estrela de 5 pontas -->
            <polygon id="estrela" 
                     points="0,-15 3.4,-4.6 14.3,-4.6 5.5,1.8 8.8,12.1 0,5.7 -8.8,12.1 -5.5,1.8 -14.3,-4.6 -3.4,-4.6" 
                     stroke="#1a1a1a" stroke-width="0.8" stroke-linejoin="round" />
        </defs>

        <!-- As 5 estrelas do SPFC -->
        <g id="estrelas">
            <!-- Estrelas douradas laterais -->
            <use href="#estrela" x="50" y="78" fill="#f4c430" />
            <use href="#estrela" x="250" y="78" fill="#f4c430" />

            <!-- Estrelas vermelhas dos mundiais -->
            <use href="#estrela" x="100" y="78" fill="#e30613" />
            <use href="#estrela" x="200" y="78" fill="#e30613" />
            <!-- Estrela vermelha central em destaque -->
            <use href="#estrela" x="150" y="48" fill="#e30613" transform="translate(150, 48) scale(1.3) translate(-150, -48)" />
        </g>

        <!-- Escudo do SPFC -->
        <g id="escudo" transform="translate(150, 105) scale(1.23) translate(-176.65, -345.77)">
            <!-- Base e contorno externo do escudo -->
            <path d="M 73.294,345.774 L 280,345.774 L 280,425.656 L 176.647,551.656 L 73.294,425.656 Z"
                  fill="#ffffff" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" />

            <!-- Faixa preta superior -->
            <rect x="83.382" y="356.813" width="186.529" height="54.51" fill="#000000" />

            <!-- Letras SPFC oficiais em branco -->
            <path fill="#ffffff" fill-rule="evenodd"
                  d="M 231.846,365.938 C 226.038,365.938 224.928,369.215 224.928,371.289 L 224.928,396.219 C 224.741,400.581 228.290,402.781 231.566,402.781 L 250.213,402.781 C 254.232,402.781 258.397,400.566 258.397,395.656 L 258.397,388.656 L 249.647,388.656 L 249.647,391.125 C 249.881,392.978 248.999,394.250 247.592,394.188 L 235.835,394.188 C 234.120,394.298 232.492,394.310 232.928,392 L 232.928,375.844 C 233.274,374.716 232.050,373.065 235.397,372.938 L 248.053,372.938 C 248.810,373.355 249.954,372.610 249.960,375.281 L 250.085,378.188 L 258.241,378.188 L 258.241,371.239 C 258.241,367.205 254.761,365.938 251.629,365.938 Z M 163.743,365.938 L 138.147,365.938 L 138.147,402.5 L 147.042,402.5 L 147.042,389.011 L 163.682,389.011 C 167.146,389.011 170.887,387.362 170.887,382.688 L 170.887,372.062 C 170.887,369.113 168.624,365.988 163.743,365.938 Z M 99.866,365.938 C 96.429,366.208 94.998,367.802 95.053,370.594 L 95.053,382.689 C 95.053,384.859 97.022,386.907 102.123,386.907 L 117.616,386.907 C 118.356,386.907 118.772,387.282 118.772,388.436 L 118.772,392.312 C 118.772,393.468 118.359,394.344 117.389,394.344 L 94.897,394.344 L 94.897,402.188 L 122.221,402.188 C 126.272,402.188 127.803,400.110 127.803,397.252 L 127.803,384 C 127.803,379.055 121.760,379.344 119.528,379.344 L 105.615,379.344 C 104.364,379.470 103.164,378.307 103.272,377.074 L 103.272,374.478 C 103.140,373.523 104.055,372.805 105.272,372.812 L 127.803,372.781 L 127.803,365.938 Z M 181.835,365.938 L 181.835,402.625 L 189.960,402.625 L 189.960,388.938 L 208.303,388.938 L 208.303,380.938 L 190.116,380.938 L 190.116,372.781 L 214.585,372.781 L 214.585,365.938 Z M 147.042,373.969 L 160.678,373.969 C 161.689,373.969 162.835,374.043 162.835,376.009 L 162.835,379.358 C 162.835,381.377 161.779,381.452 160.710,381.452 L 147.042,381.452 Z" />

            <!-- Triângulo vermelho inferior esquerdo -->
            <path d="M 83.794,421.127 L 160.382,421.127 L 160.382,515.009 Z" fill="#e30613" />

            <!-- Triângulo preto inferior direito -->
            <path d="M 269.088,421.127 L 192.500,421.127 L 192.500,515.009 Z" fill="#000000" />
        </g>
    </svg>
</body>
</html>
