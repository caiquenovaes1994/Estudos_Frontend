<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
    <defs>
        <linearGradient id="primaryGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38BDF8" />
            <stop offset="50%" stop-color="#6366F1" />
            <stop offset="100%" stop-color="#A855F7" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="12" y1="8" x2="36" y2="40" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#C084FC" stop-opacity="0.6" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Background rounded squircle with subtle border -->
    <rect x="2" y="2" width="44" height="44" rx="14" fill="#0F172A" />
    <rect x="2" y="2" width="44" height="44" rx="14" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Stylized modern tech monogram / mark -->
    <path d="M15 17C15 13.6863 17.6863 11 21 11H27C30.3137 11 33 13.6863 33 17C33 20.3137 30.3137 23 27 23H21C17.6863 23 15 25.6863 15 29C15 32.3137 17.6863 35 21 35H27C30.3137 35 33 32.3137 33 29" 
          stroke="url(#primaryGrad)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)" />
    
    <!-- Inner glowing node points -->
    <circle cx="21" cy="11" r="2.5" fill="#38BDF8" />
    <circle cx="27" cy="35" r="2.5" fill="#C084FC" />
    <circle cx="24" cy="23" r="2" fill="#FFFFFF" />
</svg>
