<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login 6</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <div class="hero">
            <svg class="heart" viewBox="0 0 101.7 87.6" width="100" height="100" aria-hidden="true">
                <path d="M50.8,87.6 C49.2,87.6 4.3,58.8 0,33.5 C-3.3,13.6 12.1,0 28.5,0 C39.6,0 47.6,6.6 50.8,14.6 C54.1,6.6 62.1,0 73.2,0 C89.6,0 105,13.6 101.7,33.5 C97.4,58.8 52.5,87.6 50.8,87.6 Z" fill="#e74c3c"/>
            </svg>
            <svg class="heart" viewBox="0 0 101.7 87.6" width="100" height="100" aria-hidden="true">
                <path d="M50.8,87.6 C49.2,87.6 4.3,58.8 0,33.5 C-3.3,13.6 12.1,0 28.5,0 C39.6,0 47.6,6.6 50.8,14.6 C54.1,6.6 62.1,0 73.2,0 C89.6,0 105,13.6 101.7,33.5 C97.4,58.8 52.5,87.6 50.8,87.6 Z" fill="#e74c3c"/>
            </svg>
            <svg class="heart" viewBox="0 0 101.7 87.6" width="100" height="100" aria-hidden="true">
                <path d="M50.8,87.6 C49.2,87.6 4.3,58.8 0,33.5 C-3.3,13.6 12.1,0 28.5,0 C39.6,0 47.6,6.6 50.8,14.6 C54.1,6.6 62.1,0 73.2,0 C89.6,0 105,13.6 101.7,33.5 C97.4,58.8 52.5,87.6 50.8,87.6 Z" fill="#e74c3c"/>
            </svg>
            <svg class="heart" viewBox="0 0 101.7 87.6" width="100" height="100" aria-hidden="true">
                <path d="M50.8,87.6 C49.2,87.6 4.3,58.8 0,33.5 C-3.3,13.6 12.1,0 28.5,0 C39.6,0 47.6,6.6 50.8,14.6 C54.1,6.6 62.1,0 73.2,0 C89.6,0 105,13.6 101.7,33.5 C97.4,58.8 52.5,87.6 50.8,87.6 Z" fill="#e74c3c"/>
            </svg>
            <svg class="heart" viewBox="0 0 101.7 87.6" width="100" height="100" aria-hidden="true">
                <path d="M50.8,87.6 C49.2,87.6 4.3,58.8 0,33.5 C-3.3,13.6 12.1,0 28.5,0 C39.6,0 47.6,6.6 50.8,14.6 C54.1,6.6 62.1,0 73.2,0 C89.6,0 105,13.6 101.7,33.5 C97.4,58.8 52.5,87.6 50.8,87.6 Z" fill="#e74c3c"/>
            </svg>
        </div>
        <form class="form">
            <img src="logo.svg" alt="logo" />
            <h3>Login to your account.</h3>
            <div class="socials">
                <button type="button" class="social-btn">
                    <img src="google.svg" alt="Google" />
                    <p><span class="extra-text">Login with</span> Google</p>
                </button>
                <button type="button" class="social-btn">
                    <img src="facebook.svg" alt="Facebook" />
                    <p><span class="extra-text">Login with</span> Facebook</p>
                </button>
            </div>
            <span class="or"></span>
            <label class="field">
                <span class="material-symbols-outlined">mail</span>
                <input type="email" placeholder="Email" required autocomplete="email" />
            </label>
            <label class="field">
                <span class="material-symbols-outlined">lock</span>
                <input type="password" placeholder="Password" required autocomplete="current-password" />
            </label>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
