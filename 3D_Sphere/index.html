                <input type="checkbox" id="pause">
                <span>Pausar Onda</span>
            </label>

                <span>Pausar Luz</span>
            </label>
            <label for="rotate-sphere">
                <input type="checkbox" id="rotate-sphere" checked>
                <span>Girar Esfera</span>
            </label>
            <label for="toggle-orbit">
                <input type="checkbox" id="toggle-orbit" checked>

            </label>
        </nav>
