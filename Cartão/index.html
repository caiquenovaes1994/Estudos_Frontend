<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="balance-card">
    <div class="card-header">
        <div class="bank-name">
            <span class="bank-logo">S</span>
            <span>SkyBank</span>
        </div>

        <span class="card-chip"></span>
    </div>

    <div class=""balance-section">
        <div class="balance-label">
            <span>Available Balance</span>

            <label class="visibility-button" for="toggle-balance">
                <input type="checkbox" id="toggle-balance" />
                <span class="show-icon">👁️</span>
                <span class="hide-icon">👁️</span>
            </label>
        </div>
        
        <div class="balance-value">
            <span class="visible-balance">$12,480.50</span>
            <span class="hidden-balance">******</span>
        </div>
    </div>

    <div class="card-number">
        <span>****</span>
        <span>****</span>
        <span>****</span>
        <span>4286</span>
    </div>

    <div class="card-footer">
        <div>
            <small>CARD HOLDER</small>
            <strong>SAIFUL KHAN</strong>
        </div>

        <div>
            <small>EXPIRES</small>
            <strong>09/29</strong>
        </div>

        <div class="card-brand">
            <span></span>
            <span></span>
        </div>

        <div class="card-glow"></div>
    </div>
</div>
</body>
</html>
